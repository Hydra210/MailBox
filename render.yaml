services:
  - type: web
    name: mailbox
    runtime: node
    plan: free
    region: ohio
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: INBOUND_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD_HASH
        sync: false
